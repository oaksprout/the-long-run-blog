name: Deploy to Railway

on:
  push:
    branches:
      - 'job/4e1821f9-d9a2-457b-8916-319da4466368-blog-growth-template'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service blog-the-long-run
